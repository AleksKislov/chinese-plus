<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>ChinesePlus</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../icons/icon-32.png" alt="" width="20" height="20" />
      <span>ChinesePlus</span>
    </header>

    <label class="toggle">
      <input id="enabled" type="checkbox" />
      <span class="switch"></span>
      <span>Перевод при наведении</span>
    </label>
    <p class="hint">Наведите курсор на китайский текст на любом сайте. Быстро включить: <kbd>Alt+Shift+Z</kbd></p>

    <section id="account" class="account"></section>

    <footer id="dict-info"></footer>

    <script src="popup.js"></script>
  </body>
</html>
