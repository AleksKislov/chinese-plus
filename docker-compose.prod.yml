version: "3.8"

services:
  mongo_chin_dev:
    image: mongo
    container_name: mongo_chin_dev
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - new_bylh_mongodata:/data/db
    networks:
      new_bylh_bylh_net:

  chin_plus_be:
    container_name: chin_plus_be
    image: chin_plus_be:${VERSION}
    restart: unless-stopped
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    ports:
      - 10000:10000
    environment:
      BE_VERSION: ${VERSION}
    env_file:
      - ./server/config/.env.prod
    networks:
      new_bylh_bylh_net:

  chin_plus_fe:
    container_name: chin_plus_fe
    image: std016039/chin_plus_fe:${VERSION}
    restart: unless-stopped
    environment:
      - VERSION=${VERSION}
    ports:
      - 4000:3000
    networks:
      new_bylh_bylh_net:

  chin_plus_go_be:
    container_name: chin_plus_go_be
    image: std016039/chin_plus_go_be:${VERSION}
    restart: unless-stopped
    environment:
      - VERSION=${VERSION}
      - MONGO_URI=${MONGO_URI}
      - DB_NAME=${DB_NAME}
      - CHECK_WORD_API=${CHECK_WORD_API}
    ports:
      - 12000:12000
    networks:
      new_bylh_bylh_net:

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    mem_limit: 64m
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      new_bylh_bylh_net:

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    devices:
      - /dev/kmsg
    networks:
      new_bylh_bylh_net:

  grafana-alloy:
    image: grafana/alloy:latest
    container_name: grafana_alloy
    restart: unless-stopped
    mem_limit: 128m
    env_file:
      - ./monitoring/.env
    volumes:
      - ./monitoring/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    depends_on:
      - node-exporter
      - cadvisor
    networks:
      new_bylh_bylh_net:

volumes:
  new_bylh_mongodata:
    external: true

networks:
  new_bylh_bylh_net:
    external: true
